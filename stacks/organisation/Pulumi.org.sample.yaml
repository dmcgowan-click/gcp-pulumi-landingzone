config:
  gcp:region: australia-southeast1
  organisation:organisation: "<organisation numeric ID>"
  organisation:billing: "<billing account id (format: XXXXXX-XXXXXX-XXXXXX)>"
  organisation:domain: "<google cloud domain>"
  organisation:environments:
    - name: <environment name a>
      bindings: # (optional) - IAM bindings applied to this environment's folder
        <role_id_a>:
          - <principal a>
          - <principal b>
    - name: <environment name b>
  organisation:bindingsOrgAdmin:
    group: "<group:email@domain>"
    sa: # (optional)
      enabled: <true|false>
      name: <service account name (optional, defaults to cicd-org)>
    bindings:
      - <role_id_a>
      - <role_id_b>
  organisation:apisAdditional: # (optional)
    - <additional api>
  organisation:orgPolicyDisableIAMExternalOrg: true # (optional, defaults to true)
  organisation:orgPolicyDisableServiceAccountKeyCreation: true # (optional, defaults to true)
  organisation:orgPolicyAdditional:
    # --- Network & Data Exfiltration ---
    compute.vmExternalIpAccess:
      spec:
        rules:
          - denyAll: "TRUE"
    compute.restrictVpcPeering:
      spec:
        rules:
          - denyAll: "TRUE"
    compute.skipDefaultNetworkCreation:
      spec:
        rules:
          - enforce: "TRUE"
    sql.restrictPublicIp:
      spec:
        rules:
          - enforce: "TRUE"
    compute.restrictLoadBalancerCreationForTypes:
      spec:
        rules:
          - denyAll: "TRUE"
    # --- Identity & Access ---
    iam.disableServiceAccountKeyUpload:
      spec:
        rules:
          - enforce: "TRUE"
    iam.automaticIamGrantsForDefaultServiceAccounts:
      spec:
        rules:
          - enforce: "TRUE"
    # iam.disableWorkloadIdentityClusterCreation:
    #   spec:
    #     rules:
    #       - enforce: "TRUE"
    # --- Storage & Data Protection ---
    storage.uniformBucketLevelAccess:
      spec:
        rules:
          - enforce: "TRUE"
    storage.publicAccessPrevention:
      spec:
        rules:
          - enforce: "TRUE"
    # --- Compute & Runtime ---
    compute.requireOsLogin:
      spec:
        rules:
          - enforce: "TRUE"
    compute.disableSerialPortAccess:
      spec:
        rules:
          - enforce: "TRUE"
    compute.disableNestedVirtualization:
      spec:
        rules:
          - enforce: "TRUE"
    # compute.requireShieldedVm:
    #   spec:
    #     rules:
    #       - enforce: "TRUE"
    # --- Resource Location (recommended: uncomment and set to your regions) ---
    # gcp.resourceLocations:
    #   spec:
    #     rules:
    #       - values:
    #           allowedValues:
    #             - "<your-region-1>"
    #             - "<your-region-2>"
  organisation:labels: # (optional) - GCP project labels (keys/values: lowercase, digits, underscores, hyphens only; max 63 chars)
    <key>: <value>
  # organisation:rootZone: # (optional) - creates a public root DNS zone under the seed project
  #   dnsName: <valid FQDN that you own, e.g. gcp.example.com>
  #   zoneName: <name of zone> # (optional - derived from dnsName if not provided)
  #   description: <description of zone> # (optional - derived from dnsName if not provided)
