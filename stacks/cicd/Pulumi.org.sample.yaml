config:
  gcp:region: <valid gcp region (e.g. australia-southeast1)>
  cicd:organisation: "<organisation numeric ID>"
  # cicd:folder: "<common folder numeric ID>" # (optional - if not provided, looks up folder by name "common" under the organisation)
  cicd:billing: "<billing account id (format: XXXXXX-XXXXXX-XXXXXX)>"
  cicd:seedProjectID: "<project ID of the seed project from the organisation stack>"
  cicd:defaultLocation: "<valid gcp region for regional resources (e.g. australia-southeast1)>"
  # cicd:apisAdditional: # (optional)
  #   - <additional api>
  cicd:artifactRegistries: # (optional)
    <registry_name>:
      format: <docker | npm | python>
      mode: standard
      # multiRegion: <valid multi region> # (optional)
      # immutable: <enabled | disabled> # (optional - docker only, default disabled)
      # cleanupPolicies: <delete | keep> # (optional, default delete)
      # labels: # (optional)
      #   <key>: <value>
  # cicd:cloudBuild: # (optional) - 2nd gen Cloud Build repository links
  #   repositoryLinks:
  #     <link_name>:
  #       connection: <short name of a pre-existing 2nd gen connection in the cicd project at defaultLocation>
  #       repositories:
  #         - remoteUri: <git remote URI, e.g. https://github.com/owner/repo.git>
  #           # name: <repository resource name (optional - default: derived from link_name and repo slug)>
  #   triggers: # (optional) - one or more Cloud Build triggers
  #     <trigger_name>:
  #       # description: <trigger description (optional)>
  #       event: <push-to-branch | push-new-tag | pull-request>
  #       source:
  #         linkName: <link_name as defined in repositoryLinks>
  #         remoteUri: <remoteUri as defined under that link_name's repositories>
  #       # branch: <branch/tag regex (optional - defaults to .*)>
  #       # includedFiles: # (optional) - build only runs when a changed file matches one of these globs
  #       #   - <glob pattern, e.g. modules/**>
  #       # ignoredFiles: # (optional) - changes limited to these globs will not fire the build
  #       #   - <glob pattern, e.g. **/*.md>
  #       configuration:
  #         inlineCustom:
  #           steps:
  #             - name: ubuntu
  #               args:
  #                 - echo
  #                 - hello world
  #       cicdSaAssume: # exactly one of orgSa / serviceProjectIDs
  #         orgSa: <true | false>
  #         # serviceProjectIDs:
  #         #   - <service project id>
  # cicd:labels: # (optional)
  #   <key>: <value>
